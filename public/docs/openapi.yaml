          in: header
          name: X-Mock-Webhook-Secret
          description: ''
          example: segredo-local
          schema:
            type: string
      responses:
        202:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Evento recebido.'
                  data:
                    event_id: evt_0001
                    type: payment.paid
                    processed_at: null
                properties:
                  message:
                    type: string
                    example: 'Evento recebido.'
                  data:
                    type: object
                    properties:
                      event_id:
                        type: string
                        example: evt_0001
                      type:
                        type: string
                        example: payment.paid
                      processed_at:
                        type: string
                        example: null
                        nullable: true
      tags:
        - Pagamentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  description: 'ID único do evento no gateway; repetido = ignorado (idempotente). Must not be greater than 100 characters.'
                  example: evt_000123
                type:
                  type: string
                  description: 'Tipo do evento.'
                  example: payment.paid
                  enum:
                    - payment.paid
                    - payment.failed
                data:
                  type: object
                  description: 'Dados do evento.'
                  example: []
                  properties:
                    external_id:
