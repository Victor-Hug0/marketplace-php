                                type: integer
                                example: 1290
                              eta_days:
                                type: integer
                                example: 3
      tags:
        - Frete
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                address_id:
                  type: string
                  description: 'Endereço salvo do comprador; obrigatório sem cep. This field is required when <code>cep</code> is not present. Must be a valid UUID.'
                  example: 01a159cb-1b3e-73da-b5a5-f225c2d77ad9
                  nullable: true
                cep:
                  type: string
                  description: 'CEP de destino; obrigatório sem address_id. This field is required when <code>address_id</code> is not present. Must match the regex /^\d{5}-?\d{3}$/.'
                  example: 01311-000
                  nullable: true
  /api/v1/checkout:
    post:
      summary: 'Fechar pedido'
      operationId: fecharPedido
      description: 'Transação única: revalida ofertas e estoque, congela preços e frete, cria um subpedido por loja, reserva o estoque e esvazia o carrinho. Mesma `Idempotency-Key` devolve o pedido existente com 200.'
      parameters:
        -
          in: header
          name: Idempotency-Key
          description: ''
          example: f3c1b2a4-0001
          schema:
            type: string
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
