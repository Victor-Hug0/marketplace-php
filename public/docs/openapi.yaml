                        cpf: '81919716147'
                        phone_number: '58408704390'
                        created_at: '2026-10-20T12:44:38-03:00'
                        updated_at: '2026-10-20T12:44:38-03:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
