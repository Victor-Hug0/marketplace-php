  /api/v1/shipping/quotes:
    post:
      summary: 'Cotar frete do carrinho'
      operationId: cotarFreteDoCarrinho
      description: 'Uma cotação por loja do carrinho, para um `cep` ou `address_id` do próprio usuário. Opções da mais barata para a mais cara; modalidade que não comporta o peso não aparece.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      store:
                        id: 01a14513-0e23-726f-b299-104a96511ebb
                        store_name: 'Loja Demo'
                        slug: loja-demo
                      zone: local
                      destination_cep: '01311000'
                      billable_weight_grams: 500
                      options:
                        -
                          service_code: simulated_standard
                          service_name: 'Entrega padrão (simulada)'
                          price_cents: 1290
                          eta_days: 3
                        -
                          service_code: simulated_express
                          service_name: 'Entrega expressa (simulada)'
                          price_cents: 2190
                          eta_days: 1
                properties:
                  data:
                    type: array
                    example:
                      -
                        store:
                          id: 01a14513-0e23-726f-b299-104a96511ebb
                          store_name: 'Loja Demo'
                          slug: loja-demo
                        zone: local
                        destination_cep: '01311000'
                        billable_weight_grams: 500
                        options:
                          -
                            service_code: simulated_standard
                            service_name: 'Entrega padrão (simulada)'
                            price_cents: 1290
                            eta_days: 3
                          -
                            service_code: simulated_express
                            service_name: 'Entrega expressa (simulada)'
                            price_cents: 2190
                            eta_days: 1
                    items:
                      type: object
                      properties:
                        store:
                          type: object
                          properties:
                            id:
                              type: string
                              example: 01a14513-0e23-726f-b299-104a96511ebb
                            store_name:
                              type: string
                              example: 'Loja Demo'
                            slug:
                              type: string
                              example: loja-demo
                        zone:
                          type: string
                          example: local
                        destination_cep:
                          type: string
                          example: '01311000'
                        billable_weight_grams:
                          type: integer
                          example: 500
                        options:
                          type: array
                          example:
                            -
                              service_code: simulated_standard
                              service_name: 'Entrega padrão (simulada)'
                              price_cents: 1290
                              eta_days: 3
                            -
                              service_code: simulated_express
                              service_name: 'Entrega expressa (simulada)'
                              price_cents: 2190
                              eta_days: 1
                          items:
                            type: object
                            properties:
                              service_code:
                                type: string
                                example: simulated_standard
                              service_name:
                                type: string
                                example: 'Entrega padrão (simulada)'
                              price_cents:
                                type: integer
                                example: 1290
                              eta_days:
                                type: integer
                                example: 3
      tags:
        - Frete
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                address_id:
                  type: string
                  description: 'Endereço salvo do comprador; obrigatório sem cep. This field is required when <code>cep</code> is not present. Must be a valid UUID.'
                  example: 01a159cb-1b3e-73da-b5a5-f225c2d77ad9
                  nullable: true
                cep:
                  type: string
                  description: 'CEP de destino; obrigatório sem address_id. This field is required when <code>address_id</code> is not present. Must match the regex /^\d{5}-?\d{3}$/.'
                  example: 01311-000
                  nullable: true
