        - Usuários
  /api/v1/stores:
    post:
      summary: 'Solicitar loja'
      operationId: solicitarLoja
      description: 'Cria a loja em `pending`. Uma loja por usuário, inclusive contando rejeitadas. O papel `seller` só é concedido quando o admin aprova.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 01a159fc-713b-7136-8f5c-9631931702d2
                    store_name: 'Bailey Inc'
                    slug: bailey-inc-9365
                    description: 'Velit et fugiat sunt nihil accusantium.'
                    logo_url: null
                    banner_url: null
                    commercial_email: lafayette.considine@schuster.biz
                    commercial_phone: '68210674842'
                    origin_cep: '98808182'
                    document_type: cnpj
                    document: '53681349837432'
                    status: pending
                    rejection_reason: null
                    reviewed_at: null
