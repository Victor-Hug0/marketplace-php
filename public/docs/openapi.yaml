              type: object
              properties:
                q:
                  type: string
                  description: 'Must not be greater than 120 characters.'
                  example: b
                  nullable: true
                category_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: a4855dc5-0acb-33c3-b921-f4291f719ca0
                  nullable: true
                category:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: z
                  nullable: true
                store_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 977e5426-8d13-3824-86aa-b092f8ae52c5
                  nullable: true
                store:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'y'
                  nullable: true
                per_page:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 100.'
                  example: 1
                cursor:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
      security: []
    parameters:
      -
        in: path
        name: slug
        description: 'The slug of the store.'
        example: architecto
        required: true
        schema:
          type: string
