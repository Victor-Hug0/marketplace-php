openapi: 3.0.3
info:
  title: 'Marketplace API'
  description: 'API REST de um marketplace multi-seller: lojas, catálogo, ofertas com Buy Box, checkout idempotente, pagamento simulado, ledger, frete, envio e pós-venda.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8080'
tags:
  -
    name: Autenticação
    description: ''
  -
    name: Usuários
    description: ''
  -
    name: Lojas
    description: ''
  -
    name: Categorias
    description: ''
  -
    name: Produtos
    description: ''
  -
    name: 'Ofertas e reservas'
    description: ''
  -
    name: Endereços
    description: ''
  -
    name: Carrinho
    description: ''
  -
    name: Frete
    description: ''
  -
    name: Checkout
    description: ''
  -
    name: Pedidos
    description: ''
  -
    name: Pagamentos
    description: ''
  -
    name: Envio
    description: ''
  -
    name: Financeiro
    description: ''
  -
    name: Avaliações
    description: ''
  -
    name: Pós-venda
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtenha o token em <code>POST /api/v1/auth/login</code> e use o <code>access_token</code>.'
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: Entrar
      operationId: entrar
      description: 'Devolve `access_token` (1 hora) e `refresh_token` (30 dias) e invalida os pares anteriores do usuário. 10 falhas por IP bloqueiam o login por 60 segundos (429).'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Login realizado com sucesso'
                  user:
                    id: 01a14513-4821-7084-bb71-dbc2e1d84d94
                    name: 'Maria Compradora'
                    email: maria@exemplo.com
                  access_token: 1|aBcD...
                  refresh_token: 2|eFgH...
                properties:
                  message:
                    type: string
                    example: 'Login realizado com sucesso'
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01a14513-4821-7084-bb71-dbc2e1d84d94
                      name:
                        type: string
                        example: 'Maria Compradora'
                      email:
                        type: string
                        example: maria@exemplo.com
                  access_token:
                    type: string
                    example: 1|aBcD...
                  refresh_token:
                    type: string
                    example: 2|eFgH...
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Credenciais inválidas'
                  timestamp: '2026-10-20T10:00:00-03:00'
                  errors: []
                properties:
                  message:
                    type: string
                    example: 'Credenciais inválidas'
                  timestamp:
                    type: string
                    example: '2026-10-20T10:00:00-03:00'
                  errors:
                    type: array
                    example: []
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: Sair
      operationId: sair
      description: 'Revoga o par de tokens do usuário.'
      parameters: []
      responses:
        204:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: ''
      tags:
        - Autenticação
  /api/v1/auth/register:
    post:
      summary: 'Cadastrar comprador'
      operationId: cadastrarComprador
      description: 'Cria o usuário com o papel `buyer`. Senha com 8 a 64 caracteres, maiúscula, minúscula, número e símbolo. Limite de 10 tentativas por IP e e-mail.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Usuário registrado com sucesso'
                  user:
                    id: 01a14513-4821-7084-bb71-dbc2e1d84d94
                    name: 'Maria Compradora'
                    email: maria@exemplo.com
                properties:
                  message:
                    type: string
                    example: 'Usuário registrado com sucesso'
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01a14513-4821-7084-bb71-dbc2e1d84d94
                      name:
                        type: string
                        example: 'Maria Compradora'
                      email:
                        type: string
                        example: maria@exemplo.com
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: zbailey@example.net
                cpf:
                  type: string
                  description: 'Must not be greater than 11 characters.'
                  example: iyvdlj
                phone_number:
                  type: string
                  description: 'Must not be greater than 11 characters.'
                  example: nikhwa
                password:
                  type: string
                  description: ''
                  example: architecto
                password_confirmation:
                  type: string
                  description: ''
                  example: architecto
              required:
                - name
                - email
                - cpf
                - phone_number
                - password
                - password_confirmation
      security: []
  /api/v1/auth/refresh:
    post:
      summary: 'Renovar tokens'
      operationId: renovarTokens
      description: 'Envie o `refresh_token` como Bearer. Devolve um par novo e invalida o anterior; um `access_token` aqui responde 401.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token de atualização realizado com sucesso'
                  access_token: 3|iJkL...
                  refresh_token: 4|mNoP...
                properties:
                  message:
                    type: string
                    example: 'Token de atualização realizado com sucesso'
                  access_token:
                    type: string
                    example: 3|iJkL...
                  refresh_token:
                    type: string
                    example: 4|mNoP...
      tags:
        - Autenticação
  /api/v1/users/me:
    get:
      summary: 'Usuário autenticado'
      operationId: usurioAutenticado
      description: 'Dados do usuário com papéis e resumo da loja, se houver.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  user:
                    id: 01a14513-4821-7084-bb71-dbc2e1d84d94
                    name: 'Maria Compradora'
                    email: maria@exemplo.com
                    cpf: '12345678901'
                    phone_number: '11999999999'
                    roles:
                      - buyer
                      - seller
                    store:
                      id: 01a14513-0e23-726f-b299-104a96511ebb
                      store_name: 'Loja Demo'
                      slug: loja-demo
                      status: active
                    created_at: '2026-10-20T10:00:00-03:00'
                    updated_at: '2026-10-20T10:00:00-03:00'
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01a14513-4821-7084-bb71-dbc2e1d84d94
                      name:
                        type: string
                        example: 'Maria Compradora'
                      email:
                        type: string
                        example: maria@exemplo.com
                      cpf:
                        type: string
                        example: '12345678901'
                      phone_number:
                        type: string
                        example: '11999999999'
                      roles:
                        type: array
                        example:
                          - buyer
                          - seller
                        items:
                          type: string
                      store:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 01a14513-0e23-726f-b299-104a96511ebb
                          store_name:
                            type: string
                            example: 'Loja Demo'
                          slug:
                            type: string
                            example: loja-demo
                          status:
                            type: string
                            example: active
                      created_at:
                        type: string
                        example: '2026-10-20T10:00:00-03:00'
                      updated_at:
                        type: string
                        example: '2026-10-20T10:00:00-03:00'
      tags:
        - Usuários
  /api/v1/users:
    get:
      summary: 'Listar usuários'
      operationId: listarUsurios
