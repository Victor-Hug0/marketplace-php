                    updated_at: '2026-10-20T12:44:38-03:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01a159fc-713b-7136-8f5c-9631931702d2
                      store_name:
                        type: string
                        example: 'Bailey Inc'
                      slug:
                        type: string
                        example: bailey-inc-9365
                      description:
                        type: string
                        example: 'Velit et fugiat sunt nihil accusantium.'
                      logo_url:
                        type: string
                        example: null
                        nullable: true
                      banner_url:
                        type: string
                        example: null
                        nullable: true
                      commercial_email:
                        type: string
                        example: lafayette.considine@schuster.biz
                      commercial_phone:
                        type: string
                        example: '68210674842'
                      origin_cep:
                        type: string
                        example: '98808182'
                      document_type:
                        type: string
                        example: cnpj
                      document:
                        type: string
                        example: '53681349837432'
                      status:
                        type: string
                        example: pending
                      rejection_reason:
                        type: string
                        example: null
                        nullable: true
                      reviewed_at:
                        type: string
                        example: null
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-10-20T12:44:38-03:00'
                      updated_at:
                        type: string
                        example: '2026-10-20T12:44:38-03:00'
      tags:
        - Lojas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                store_name:
                  type: string
                  description: 'Nome público da loja. Must not be greater than 255 characters.'
                  example: 'Loja Exemplo'
                description:
                  type: string
                  description: 'Apresentação da loja. Must not be greater than 5000 characters.'
                  example: 'Eletrônicos com garantia e envio rápido.'
                  nullable: true
                commercial_email:
                  type: string
                  description: 'E-mail comercial. Must be a valid email address. Must not be greater than 255 characters.'
                  example: contato@lojaexemplo.test
                  nullable: true
                commercial_phone:
                  type: string
                  description: 'Telefone comercial, 10 a 15 dígitos. Must match the regex /^\d{10,15}$/.'
                  example: '1133334444'
                  nullable: true
                origin_cep:
                  type: string
                  description: 'CEP de onde os pedidos saem, usado no frete. Must match the regex /^\d{5}-?\d{3}$/.'
                  example: 01310-100
                  nullable: true
                document_type:
                  type: string
                  description: 'Tipo de documento do titular.'
                  example: cnpj
                  enum:
                    - cpf
                    - cnpj
                document:
                  type: string
                  description: 'CPF (11) ou CNPJ (14) só com dígitos; único entre as lojas.'
                  example: '11222333000181'
              required:
                - store_name
                - document_type
                - document
  /api/v1/stores/me:
    get:
      summary: 'Minha loja'
      operationId: minhaLoja
      description: 'Loja do usuário autenticado, com documento e status.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 01a159fc-713d-705e-8b54-7f0d94e13cfe
                    store_name: 'Price Ltd'
                    slug: price-ltd-1881
