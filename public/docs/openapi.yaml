  /api/v1/webhooks/payments/mock:
    post:
      summary: 'Webhook do gateway simulado'
      operationId: webhookDoGatewaySimulado
      description: 'Exige o header `X-Mock-Webhook-Secret` igual a `PAYMENTS_MOCK_WEBHOOK_SECRET`. O evento é enfileirado (202); um `event_id` repetido não tem efeito (200).'
      parameters:
        -
          in: header
          name: X-Mock-Webhook-Secret
          description: ''
          example: segredo-local
          schema:
            type: string
      responses:
        202:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Evento recebido.'
                  data:
                    event_id: evt_0001
                    type: payment.paid
                    processed_at: null
                properties:
                  message:
                    type: string
                    example: 'Evento recebido.'
                  data:
                    type: object
                    properties:
                      event_id:
                        type: string
                        example: evt_0001
                      type:
                        type: string
                        example: payment.paid
                      processed_at:
                        type: string
                        example: null
                        nullable: true
      tags:
        - Pagamentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  description: 'ID único do evento no gateway; repetido = ignorado (idempotente). Must not be greater than 100 characters.'
                  example: evt_000123
                type:
                  type: string
                  description: 'Tipo do evento.'
                  example: payment.paid
                  enum:
                    - payment.paid
                    - payment.failed
                data:
                  type: object
                  description: 'Dados do evento.'
                  example: []
                  properties:
                    external_id:
                      type: string
                      description: 'external_id do pagamento, devolvido ao criar a intenção. Must not be greater than 100 characters.'
                      example: mock_pay_01k7z3m9q4w2x8y6v5t3r1n0bc
                  required:
                    - external_id
              required:
                - event_id
                - type
                - data
      security: []
