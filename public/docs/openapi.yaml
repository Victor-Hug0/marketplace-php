openapi: 3.0.3
info:
  title: 'Marketplace API'
  description: 'API REST de um marketplace multi-seller: lojas, catálogo, ofertas com Buy Box, checkout idempotente, pagamento simulado, ledger, frete, envio e pós-venda.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8080'
tags:
  -
    name: Autenticação
    description: ''
  -
    name: Usuários
    description: ''
  -
    name: Lojas
    description: ''
  -
    name: Categorias
    description: ''
  -
    name: Produtos
    description: ''
  -
    name: 'Ofertas e reservas'
    description: ''
  -
    name: Endereços
    description: ''
  -
    name: Carrinho
    description: ''
  -
    name: Frete
    description: ''
  -
    name: Checkout
    description: ''
  -
    name: Pedidos
    description: ''
  -
    name: Pagamentos
    description: ''
  -
    name: Envio
    description: ''
  -
    name: Financeiro
    description: ''
  -
    name: Avaliações
    description: ''
  -
    name: Pós-venda
    description: ''
  -
    name: Notificações
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtenha o token em <code>POST /api/v1/auth/login</code> e use o <code>access_token</code>.'
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: Entrar
      operationId: entrar
      description: 'Devolve `access_token` (1 hora) e `refresh_token` (30 dias) e invalida os pares anteriores do usuário. 10 falhas por IP bloqueiam o login por 60 segundos (429).'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Login realizado com sucesso'
                  user:
                    id: 01a14513-4821-7084-bb71-dbc2e1d84d94
                    name: 'Maria Compradora'
                    email: maria@exemplo.com
                  access_token: 1|aBcD...
                  refresh_token: 2|eFgH...
                properties:
                  message:
                    type: string
                    example: 'Login realizado com sucesso'
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01a14513-4821-7084-bb71-dbc2e1d84d94
                      name:
                        type: string
                        example: 'Maria Compradora'
                      email:
                        type: string
                        example: maria@exemplo.com
                  access_token:
                    type: string
                    example: 1|aBcD...
                  refresh_token:
                    type: string
                    example: 2|eFgH...
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Credenciais inválidas'
                  timestamp: '2026-10-20T10:00:00-03:00'
                  errors: []
                properties:
                  message:
                    type: string
                    example: 'Credenciais inválidas'
                  timestamp:
                    type: string
                    example: '2026-10-20T10:00:00-03:00'
                  errors:
                    type: array
                    example: []
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'E-mail da conta. Must be a valid email address.'
                  example: comprador@marketplace.test
                password:
                  type: string
                  description: 'Senha da conta.'
                  example: Password1!
              required:
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: Sair
      operationId: sair
      description: 'Revoga o par de tokens do usuário.'
      parameters: []
      responses:
        204:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: ''
      tags:
        - Autenticação
  /api/v1/auth/register:
    post:
      summary: 'Cadastrar comprador'
      operationId: cadastrarComprador
      description: 'Cria o usuário com o papel `buyer` e envia (em fila) o link de confirmação de e-mail; o checkout fica bloqueado (403) até a confirmação. Senha com 8 a 64 caracteres, maiúscula, minúscula, número e símbolo. Limite de 10 tentativas por IP e e-mail.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Usuário registrado com sucesso. Enviamos um link de confirmação para o seu e-mail.'
                  user:
                    id: 01a14513-4821-7084-bb71-dbc2e1d84d94
                    name: 'Maria Compradora'
                    email: maria@exemplo.com
                    email_verified_at: null
                properties:
                  message:
                    type: string
                    example: 'Usuário registrado com sucesso. Enviamos um link de confirmação para o seu e-mail.'
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01a14513-4821-7084-bb71-dbc2e1d84d94
                      name:
                        type: string
                        example: 'Maria Compradora'
                      email:
                        type: string
                        example: maria@exemplo.com
                      email_verified_at:
                        type: string
                        example: null
                        nullable: true
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nome completo. Must not be greater than 255 characters.'
                  example: 'Maria Souza'
                email:
                  type: string
                  description: 'E-mail único. Must be a valid email address.'
                  example: maria@example.com
                cpf:
                  type: string
                  description: 'CPF só com dígitos; único. Must not be greater than 11 characters.'
                  example: '52998224725'
                phone_number:
                  type: string
                  description: 'Celular com DDD, só dígitos. Must not be greater than 11 characters.'
                  example: '11987654321'
                password:
                  type: string
                  description: '8 a 64 caracteres com maiúscula, minúscula, número e símbolo.'
                  example: Senha@Forte123
                password_confirmation:
                  type: string
                  description: 'Repita a senha.'
                  example: Senha@Forte123
              required:
                - name
                - email
                - cpf
                - phone_number
                - password
                - password_confirmation
      security: []
  /api/v1/auth/refresh:
    post:
      summary: 'Renovar tokens'
      operationId: renovarTokens
      description: 'Envie o `refresh_token` como Bearer. Devolve um par novo e invalida o anterior; um `access_token` aqui responde 401.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Token de atualização realizado com sucesso'
                  access_token: 3|iJkL...
                  refresh_token: 4|mNoP...
                properties:
                  message:
                    type: string
                    example: 'Token de atualização realizado com sucesso'
                  access_token:
                    type: string
                    example: 3|iJkL...
                  refresh_token:
                    type: string
                    example: 4|mNoP...
      tags:
        - Autenticação
  /api/v1/auth/forgot-password:
    post:
      summary: 'Esqueci minha senha'
      operationId: esqueciMinhaSenha
      description: 'Envia por e-mail (em fila) um link para `FRONTEND_URL/redefinir-senha?token=...&email=...`. A resposta é a mesma exista ou não a conta, para não revelar e-mails cadastrados. O link vale 60 minutos e um novo só sai depois de 60 segundos. Limite de 5 requisições por minuto.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Se o e-mail estiver cadastrado, você receberá um link para redefinir a senha.'
                properties:
                  message:
                    type: string
                    example: 'Se o e-mail estiver cadastrado, você receberá um link para redefinir a senha.'
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'E-mail da conta que vai receber o link. Must be a valid email address. Must not be greater than 255 characters.'
                  example: comprador@marketplace.test
              required:
                - email
      security: []
  /api/v1/auth/reset-password:
    post:
      summary: 'Redefinir senha'
      operationId: redefinirSenha
      description: 'Troca a senha com o token do e-mail. O token é de uso único; a troca revoga todos os tokens de acesso do usuário (todas as sessões saem) e confirma o e-mail. Limite de 5 requisições por minuto.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Senha redefinida. Entre novamente com a nova senha.'
                properties:
                  message:
                    type: string
                    example: 'Senha redefinida. Entre novamente com a nova senha.'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Os dados enviados são inválidos.'
                  timestamp: '2026-10-20T10:00:00-03:00'
                  errors:
                    token:
                      - 'O link de redefinição é inválido ou expirou. Peça um novo.'
                properties:
                  message:
                    type: string
                    example: 'Os dados enviados são inválidos.'
                  timestamp:
                    type: string
                    example: '2026-10-20T10:00:00-03:00'
                  errors:
                    type: object
                    properties:
                      token:
                        type: array
                        example:
                          - 'O link de redefinição é inválido ou expirou. Peça um novo.'
                        items:
                          type: string
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'Token recebido no link do e-mail (parâmetro token). Must not be greater than 255 characters.'
                  example: 3f6c1d0e9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e
                email:
                  type: string
                  description: 'E-mail da conta (parâmetro email do link). Must be a valid email address. Must not be greater than 255 characters.'
                  example: comprador@marketplace.test
                password:
                  type: string
                  description: 'Nova senha: 8 a 64 caracteres com maiúscula, minúscula, número e símbolo.'
                  example: NovaSenha@123
              required:
                - token
                - email
                - password
      security: []
  '/api/v1/auth/email/verify/{id}/{hash}':
    get:
      summary: 'Confirmar e-mail'
      operationId: confirmarEMail
      description: 'Destino do link enviado no cadastro. A URL é assinada e expira em 60 minutos; assinatura inválida ou vencida responde 403. Não exige token de acesso, e abrir o link de novo não dá erro.'
      parameters:
        -
          in: query
          name: expires
          description: 'Timestamp de expiração (vem no link).'
          example: 1792512000
          required: true
          schema:
            type: integer
            description: 'Timestamp de expiração (vem no link).'
            example: 1792512000
        -
          in: query
          name: signature
          description: 'Assinatura HMAC da URL (vem no link).'
          example: c0ffee
          required: true
          schema:
            type: string
            description: 'Assinatura HMAC da URL (vem no link).'
            example: c0ffee
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'E-mail confirmado.'
                properties:
                  message:
                    type: string
                    example: 'E-mail confirmado.'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Link de verificação inválido ou expirado.'
                  timestamp: '2026-10-20T10:00:00-03:00'
                  errors: []
                properties:
                  message:
                    type: string
                    example: 'Link de verificação inválido ou expirado.'
                  timestamp:
                    type: string
                    example: '2026-10-20T10:00:00-03:00'
                  errors:
                    type: array
                    example: []
      tags:
        - Autenticação
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'ID do usuário (vem no link).'
        example: 01a159cb-1b3e-73da-b5a5-f225c2d77ad9
        required: true
        schema:
          type: string
      -
        in: path
        name: hash
        description: 'SHA-1 do e-mail (vem no link).'
        example: a94a8fe5ccb19ba61c4c0873d391e987982fbbd3
        required: true
        schema:
          type: string
  /api/v1/auth/email/verification-notification:
    post:
      summary: 'Reenviar confirmação de e-mail'
      operationId: reenviarConfirmaoDeEMail
      description: 'Envia (em fila) um novo link de confirmação. 409 se o e-mail já foi confirmado. Limite de 6 requisições por minuto.'
      parameters: []
      responses:
        202:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Enviamos um novo link de confirmação para o seu e-mail.'
                properties:
                  message:
                    type: string
                    example: 'Enviamos um novo link de confirmação para o seu e-mail.'
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'O e-mail já foi confirmado.'
                  timestamp: '2026-10-20T10:00:00-03:00'
                  errors: []
                properties:
                  message:
                    type: string
                    example: 'O e-mail já foi confirmado.'
                  timestamp:
                    type: string
                    example: '2026-10-20T10:00:00-03:00'
                  errors:
                    type: array
                    example: []
      tags:
        - Autenticação
  /api/v1/auth/google/redirect:
    get:
      summary: 'URL de login com Google'
      operationId: uRLDeLoginComGoogle
      description: 'Devolve a URL de consentimento do Google. O cliente redireciona o usuário para ela; ao final, o Google volta para `GOOGLE_REDIRECT_URI` com `code`. 503 se `GOOGLE_CLIENT_ID`/`GOOGLE_CLIENT_SECRET` não estiverem configurados.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    url: 'https://accounts.google.com/o/oauth2/auth?client_id=...&redirect_uri=...&scope=openid+profile+email&response_type=code'
                properties:
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        example: 'https://accounts.google.com/o/oauth2/auth?client_id=...&redirect_uri=...&scope=openid+profile+email&response_type=code'
      tags:
        - Autenticação
      security: []
  /api/v1/auth/google/callback:
    get:
      summary: 'Callback do Google'
      operationId: callbackDoGoogle
      description: 'Troca o `code` pelo perfil do Google e devolve o par de tokens, como no login. Conta nova (201) nasce como `buyer` com e-mail confirmado; conta existente com o mesmo e-mail é vinculada (200). O e-mail precisa estar verificado no Google (422). Limite de 10 requisições por minuto.'
      parameters:
        -
          in: query
          name: code
          description: 'Código de autorização que o Google anexa ao redirecionar para esta URL. This field is required when <code>error</code> is not present. Must not be greater than 2048 characters.'
          example: 4/0AVMBsJh-exemplo
          required: false
          schema:
            type: string
            description: 'Código de autorização que o Google anexa ao redirecionar para esta URL. This field is required when <code>error</code> is not present. Must not be greater than 2048 characters.'
            example: 4/0AVMBsJh-exemplo
        -
          in: query
          name: error
          description: 'Enviado pelo Google quando o usuário cancela ou nega o acesso. Must not be greater than 255 characters.'
          example: access_denied
          required: false
          schema:
            type: string
            description: 'Enviado pelo Google quando o usuário cancela ou nega o acesso. Must not be greater than 255 characters.'
            example: access_denied
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Login com Google realizado com sucesso'
                  user:
                    id: 01a14513-4821-7084-bb71-dbc2e1d84d94
                    name: 'Maria Compradora'
                    email: maria@gmail.com
                    email_verified_at: '2026-10-20T10:00:00-03:00'
                  access_token: 1|aBcD...
                  refresh_token: 2|eFgH...
                properties:
                  message:
                    type: string
                    example: 'Login com Google realizado com sucesso'
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01a14513-4821-7084-bb71-dbc2e1d84d94
                      name:
                        type: string
                        example: 'Maria Compradora'
                      email:
                        type: string
                        example: maria@gmail.com
                      email_verified_at:
                        type: string
                        example: '2026-10-20T10:00:00-03:00'
                  access_token:
                    type: string
                    example: 1|aBcD...
                  refresh_token:
                    type: string
                    example: 2|eFgH...
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Não foi possível autenticar com o Google. Tente entrar novamente.'
                  timestamp: '2026-10-20T10:00:00-03:00'
                  errors: []
                properties:
                  message:
                    type: string
                    example: 'Não foi possível autenticar com o Google. Tente entrar novamente.'
                  timestamp:
                    type: string
                    example: '2026-10-20T10:00:00-03:00'
                  errors:
                    type: array
                    example: []
      tags:
        - Autenticação
      security: []
  /api/v1/users/me:
    get:
      summary: 'Usuário autenticado'
      operationId: usurioAutenticado
      description: 'Dados do usuário com papéis e resumo da loja, se houver.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  user:
                    id: 01a14513-4821-7084-bb71-dbc2e1d84d94
                    name: 'Maria Compradora'
                    email: maria@exemplo.com
                    cpf: '12345678901'
                    phone_number: '11999999999'
                    roles:
                      - buyer
                      - seller
                    store:
                      id: 01a14513-0e23-726f-b299-104a96511ebb
                      store_name: 'Loja Demo'
                      slug: loja-demo
                      status: active
                    created_at: '2026-10-20T10:00:00-03:00'
                    updated_at: '2026-10-20T10:00:00-03:00'
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01a14513-4821-7084-bb71-dbc2e1d84d94
                      name:
                        type: string
                        example: 'Maria Compradora'
                      email:
                        type: string
                        example: maria@exemplo.com
                      cpf:
                        type: string
                        example: '12345678901'
                      phone_number:
                        type: string
                        example: '11999999999'
                      roles:
                        type: array
                        example:
                          - buyer
                          - seller
                        items:
                          type: string
                      store:
                        type: object
                        properties:
                          id:
                            type: string
                            example: 01a14513-0e23-726f-b299-104a96511ebb
                          store_name:
                            type: string
                            example: 'Loja Demo'
                          slug:
                            type: string
                            example: loja-demo
                          status:
                            type: string
                            example: active
                      created_at:
                        type: string
                        example: '2026-10-20T10:00:00-03:00'
                      updated_at:
                        type: string
                        example: '2026-10-20T10:00:00-03:00'
      tags:
        - Usuários
  /api/v1/users:
    get:
      summary: 'Listar usuários'
      operationId: listarUsurios
      description: 'Paginação por cursor. Só admin.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 01a15ed2-f61e-73bd-a963-bed341d1248c
                      name: 'Morgan Hirthe'
                      email: dare.emelie@example.com
                      email_verified_at: '2026-10-21T11:17:26-03:00'
                      cpf: '41031927934'
                      phone_number: '16072574427'
                      created_at: '2026-10-21T11:17:26-03:00'
                      updated_at: '2026-10-21T11:17:26-03:00'
                    -
                      id: 01a15ed2-f624-7350-b5dd-6768c31a764f
                      name: 'Mr. Oswald Koch'
                      email: bailee15@example.org
                      email_verified_at: '2026-10-21T11:17:26-03:00'
                      cpf: '81919716147'
                      phone_number: '58408704390'
                      created_at: '2026-10-21T11:17:26-03:00'
                      updated_at: '2026-10-21T11:17:26-03:00'
                  links:
                    first: null
                    last: null
                    prev: null
                    next: null
                  meta:
                    path: /
                    per_page: 20
                    next_cursor: null
                    prev_cursor: null
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 01a15ed2-f61e-73bd-a963-bed341d1248c
                        name: 'Morgan Hirthe'
                        email: dare.emelie@example.com
                        email_verified_at: '2026-10-21T11:17:26-03:00'
                        cpf: '41031927934'
                        phone_number: '16072574427'
                        created_at: '2026-10-21T11:17:26-03:00'
                        updated_at: '2026-10-21T11:17:26-03:00'
                      -
                        id: 01a15ed2-f624-7350-b5dd-6768c31a764f
                        name: 'Mr. Oswald Koch'
                        email: bailee15@example.org
                        email_verified_at: '2026-10-21T11:17:26-03:00'
                        cpf: '81919716147'
                        phone_number: '58408704390'
                        created_at: '2026-10-21T11:17:26-03:00'
                        updated_at: '2026-10-21T11:17:26-03:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 01a15ed2-f61e-73bd-a963-bed341d1248c
                        name:
                          type: string
                          example: 'Morgan Hirthe'
                        email:
                          type: string
                          example: dare.emelie@example.com
                        email_verified_at:
                          type: string
                          example: '2026-10-21T11:17:26-03:00'
                        cpf:
                          type: string
                          example: '41031927934'
                        phone_number:
                          type: string
                          example: '16072574427'
                        created_at:
                          type: string
                          example: '2026-10-21T11:17:26-03:00'
                        updated_at:
                          type: string
                          example: '2026-10-21T11:17:26-03:00'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: null
                        nullable: true
                      last:
                        type: string
                        example: null
                        nullable: true
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
