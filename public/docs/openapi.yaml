                        type: string
                        example: '17091751532'
                      origin_cep:
                        type: string
                        example: '19197161'
                      document_type:
                        type: string
                        example: cnpj
                      document:
                        type: string
                        example: '32375994731024'
                      status:
                        type: string
                        example: pending
