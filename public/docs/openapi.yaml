            type: string
      responses:
        202:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Evento recebido.'
                  data:
                    event_id: evt_0001
                    type: payment.paid
                    processed_at: null
                properties:
                  message:
                    type: string
                    example: 'Evento recebido.'
                  data:
                    type: object
                    properties:
                      event_id:
