        - Lojas
  '/api/v1/stores/{slug}':
    get:
      summary: 'Vitrine da loja'
      operationId: vitrineDaLoja
      description: 'Loja `active` pelo slug, sem documento nem motivo de rejeição, com nota média e produtos ativos paginados em `products` (filtros `q`, `category`, `category_id`).'
      parameters:
        -
          in: query
          name: q
          description: 'Texto buscado no nome e na descrição. Must not be greater than 120 characters.'
          example: smartphone
          required: false
          schema:
            type: string
            description: 'Texto buscado no nome e na descrição. Must not be greater than 120 characters.'
            example: smartphone
            nullable: true
        -
          in: query
          name: category_id
          description: 'Filtra pela categoria exata (sem subcategorias). Must be a valid UUID.'
          example: 01a159cb-4e6b-7c33-9f5a-6d7b8c9d0e1f
          required: false
          schema:
            type: string
            description: 'Filtra pela categoria exata (sem subcategorias). Must be a valid UUID.'
            example: 01a159cb-4e6b-7c33-9f5a-6d7b8c9d0e1f
            nullable: true
        -
          in: query
          name: category
          description: 'Filtra pelo slug de uma categoria ativa; ignorado com category_id. Must not be greater than 255 characters.'
          example: smartphones
          required: false
          schema:
            type: string
            description: 'Filtra pelo slug de uma categoria ativa; ignorado com category_id. Must not be greater than 255 characters.'
            example: smartphones
            nullable: true
        -
          in: query
          name: store_id
          description: 'Filtra pela loja dona do produto. Must be a valid UUID.'
          example: 01a159cb-5f7c-7d44-a06b-7e8c9d0e1f2a
          required: false
          schema:
            type: string
            description: 'Filtra pela loja dona do produto. Must be a valid UUID.'
            example: 01a159cb-5f7c-7d44-a06b-7e8c9d0e1f2a
            nullable: true
        -
          in: query
          name: store
          description: 'Filtra pelo slug da loja dona do produto; ignorado com store_id. Must not be greater than 255 characters.'
          example: loja-demo
          required: false
          schema:
            type: string
            description: 'Filtra pelo slug da loja dona do produto; ignorado com store_id. Must not be greater than 255 characters.'
            example: loja-demo
            nullable: true
        -
          in: query
          name: per_page
          description: 'Itens por página (1 a 100). Must be at least 1. Must not be greater than 100.'
          example: 20
          required: false
          schema:
            type: integer
            description: 'Itens por página (1 a 100). Must be at least 1. Must not be greater than 100.'
            example: 20
        -
          in: query
          name: cursor
          description: 'Cursor devolvido em meta.next_cursor.'
          example: architecto
          required: false
          schema:
            type: string
            description: 'Cursor devolvido em meta.next_cursor.'
            example: architecto
            nullable: true
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 01a159fc-7141-7219-85e0-d78c16b2eaa2
                    store_name: 'Bailey Ltd'
                    slug: bailey-ltd-6316
                    description: 'Et fugiat sunt nihil accusantium.'
                    logo_url: null
                    banner_url: null
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01a159fc-7141-7219-85e0-d78c16b2eaa2
                      store_name:
                        type: string
                        example: 'Bailey Ltd'
                      slug:
                        type: string
                        example: bailey-ltd-6316
                      description:
                        type: string
                        example: 'Et fugiat sunt nihil accusantium.'
                      logo_url:
                        type: string
                        example: null
                        nullable: true
                      banner_url:
                        type: string
                        example: null
                        nullable: true
      tags:
        - Lojas
      security: []
    parameters:
      -
        in: path
        name: slug
        description: 'The slug of the store.'
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/admin/stores:
    get:
      summary: 'Listar lojas'
      operationId: listarLojas
      description: 'Todas as lojas com o dono, paginadas por cursor.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 01a159fc-7201-7294-aa9c-bfe5b2bf59b0
                      store_name: 'Bergstrom, Klein and Glover'
                      slug: bergstrom-klein-and-glover-1871
                      description: 'Aliquid odit blanditiis et rerum voluptas.'
                      logo_url: null
                      banner_url: null
                      commercial_email: ttoy@pollich.com
                      commercial_phone: '18948187503'
                      origin_cep: '01082241'
                      document_type: cnpj
                      document: '88385660946456'
                      status: pending
                      rejection_reason: null
                      reviewed_at: null
                      owner:
