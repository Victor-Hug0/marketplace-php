                        example: evt_0001
                      type:
                        type: string
                        example: payment.paid
                      processed_at:
                        type: string
                        example: null
                        nullable: true
      tags:
        - Pagamentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  description: 'ID único do evento no gateway; repetido = ignorado (idempotente). Must not be greater than 100 characters.'
                  example: evt_000123
                type:
                  type: string
                  description: 'Tipo do evento.'
                  example: payment.paid
                  enum:
                    - payment.paid
