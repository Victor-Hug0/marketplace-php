name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, pdo_pgsql, pgsql, redis, zip
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  tests:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Same ports as compose.test.yml, so phpunit.xml works unchanged.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marketplace_test
          POSTGRES_PASSWORD: marketplace_test
          POSTGRES_DB: marketplace_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U marketplace_test -d marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, pdo_pgsql, pgsql, redis, zip
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Without a .env file, `artisan test` reports a warning on every test.
      - name: Prepare environment file
        run: cp .env.example .env

      - name: Run test suite
        run: php artisan test --fail-on-warning

      # Scribe only warns when an endpoint fails to document; make that fail the build.
      - name: Generate API docs
        run: |
          php artisan scribe:generate --no-interaction | tee /tmp/scribe.log
          if grep -qE 'FAIL|errors while processing routes' /tmp/scribe.log; then exit 1; fi

      - name: Validate OpenAPI spec
        run: pipx run openapi-spec-validator public/docs/openapi.yaml
